<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SIG 3D Terrain Extractor</title>
  
  <!-- Estilos Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; }
    
    #map { width: 100%; height: 50vh; }
    #view3d { width: 100%; height: 50vh; position: relative; background: #1e1e1e; }
    
    .ui-panel {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      z-index: 1000; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
      padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px;
    }

    .controls-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
    input[type=range] { flex: 1; }
    
    button {
      background: #007aff; color: white; border: none; padding: 10px 16px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button:disabled { background: #444; color: #888; }
    button.success { background: #34c759; }
    
    #status { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 20px; font-size: 12px; }
  </style>

  <!-- Librerías desde CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="status">📍 Encuadra la zona en el mapa</div>
  <div id="map"></div>
  <div id="view3d"></div>

  <div class="ui-panel">
    <div class="controls-row">
      <label for="zScale">Exageración Relieve:</label>
      <input type="range" id="zScale" min="0.5" max="3" step="0.1" value="1">
    </div>
    <div class="controls-row">
      <button id="btnGenerate">1. Generar Terreno 3D</button>
      <button id="btnExport" class="success" disabled>2. Descargar .GLB</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. Configuración del Mapa 2D (Leaflet)
    // Coordenadas iniciales centradas en Campillos-Paravientos
    const map = L.map('map').setView([39.9542, -1.5475], 14);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'OpenStreetMap'
    }).addTo(map);

    // Cuadro de selección en el mapa
    let bounds = map.getBounds();
    const selectionRect = L.rectangle(bounds, { color: "#007aff", weight: 2, fillOpacity: 0.15 }).addTo(map);

    map.on('move', () => {
      bounds = map.getBounds();
      selectionRect.setBounds(bounds);
    });

    // 2. Configuración del Visor 3D (Three.js)
    const container3d = document.getElementById('view3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    const camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 0.1, 1000);
    camera.position.set(0, -150, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container3d.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, -100, 200);
    scene.add(dirLight);

    let currentMesh = null;
    const GRID_SIZE = 128; // Resolución de malla ideal para iOS Safari

    // 3. Procesamiento de DEM y Ortofoto
    document.getElementById('btnGenerate').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.innerText = "⏳ Descargando datos del IGN...";
      document.getElementById('btnGenerate').disabled = true;

      const bbox = [
        bounds.getWest().toFixed(6),
        bounds.getSouth().toFixed(6),
        bounds.getEast().toFixed(6),
        bounds.getNorth().toFixed(6)
      ].join(',');

      // URLs de servicios INSPIRE WMS/WCS del IGN
      const ortoUrl = `https://www.ign.es/wms-inspire/pnoa-ma?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=OI.OrtofotoWM&STYLES=&CRS=CRS:84&BBOX=${bbox}&WIDTH=1024&HEIGHT=1024&FORMAT=image/jpeg`;
      const demUrl = `https://www.ign.es/wcs/rtdem?SERVICE=WCS&VERSION=1.0.0&REQUEST=GetCoverage&COVERAGE=MDT05&CRS=EPSG:4326&BBOX=${bbox}&WIDTH=${GRID_SIZE}&HEIGHT=${GRID_SIZE}&FORMAT=GeoTIFF`;

      try {
        // Cargar Ortofoto como Textura
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');
        const texture = await new Promise((res, rej) => textureLoader.load(ortoUrl, res, undefined, rej));

        // Cargar y Parsear DEM (GeoTIFF)
        const response = await fetch(demUrl);
        const arrayBuffer = await response.arrayBuffer();
        const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
        const image = await tiff.getImage();
        const rasters = await image.readRasters();
        const elevations = rasters[0];

        // Construir Geometría 3D
        if (currentMesh) scene.remove(currentMesh);

        const geometry = new THREE.PlaneGeometry(100, 100, GRID_SIZE - 1, GRID_SIZE - 1);
        const posAttribute = geometry.attributes.position;

        // Mapear alturas del DEM a la coordenada Z de los vértices
        let minZ = Infinity, maxZ = -Infinity;
        for (let i = 0; i < elevations.length; i++) {
          const z = elevations[i];
          if (z < minZ) minZ = z;
          if (z > maxZ) maxZ = z;
        }

        const zScaleInput = parseFloat(document.getElementById('zScale').value);
        const heightFactor = (10 / (maxZ - minZ || 1)) * zScaleInput;

        for (let i = 0; i < posAttribute.count; i++) {
          // GeoTIFF lee de arriba a abajo, invertimos fila para WebGL
          const row = Math.floor(i / GRID_SIZE);
          const col = i % GRID_SIZE;
          const tiffIndex = (GRID_SIZE - 1 - row) * GRID_SIZE + col;
          
          const val = elevations[tiffIndex] || minZ;
          posAttribute.setZ(i, (val - minZ) * heightFactor);
        }

        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 0.8,
          metalness: 0.1,
          side: THREE.DoubleSide
        });

        currentMesh = new THREE.Mesh(geometry, material);
        scene.add(currentMesh);

        status.innerText = "✅ ¡Modelo 3D generado!";
        document.getElementById('btnExport').disabled = false;
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Error al conectar con servidor WCS/WMS";
      } finally {
        document.getElementById('btnGenerate').disabled = false;
      }
    });

    // 4. Actualizar exageración Z
    document.getElementById('zScale').addEventListener('input', (e) => {
      if (currentMesh) document.getElementById('btnGenerate').click();
    });

    // 5. Exportación a archivo .GLB
    document.getElementById('btnExport').addEventListener('click', () => {
      if (!currentMesh) return;
      const exporter = new GLTFExporter();
      exporter.parse(
        currentMesh,
        (gltf) => {
          const blob = new Blob([gltf], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `Terreno_Campillos_3D.glb`;
          link.click();
        },
        (err) => console.error("Error al exportar GLB:", err),
        { binary: true }
      );
    });

    // Bucle de Animación
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionado táctil
    window.addEventListener('resize', () => {
      camera.aspect = container3d.clientWidth / container3d.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    });
  </script>
</body>
</html>
